services:
  db:
    image: postgres:17-alpine
    container_name: "agile_retro_db"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agile_retro -d agile_retro"]
      interval: 5s
      timeout: 5s
      retries: 10
  web_app: 
    depends_on:
      - web_api
    container_name: "agile_retro_web"
    build: 
      context: "./src/agile-retro-web"
    restart: unless-stopped
    ports: 
    - "${WEB_APP_PORT}:5173"
    volumes:
      - ./src/agile-retro-web:/workspace
    environment:
      - VITE_API_URL=${WEB_APP_API_URL}
      - VITE_HUB_URL=${WEB_APP_HUB_URL}
      - VITE_LIVEKIT_URL=${LIVEKIT_URL}
    entrypoint: ["npm", "run", "host"]
  web_api:
    container_name: "agile_retro_web_api"
    depends_on:
      - db
    build:
      context: "./src/AgileRetro.WebApi"
    restart: unless-stopped
    ports: 
    - ${WEB_API_PORT}:5101
    volumes: 
      - ./src/AgileRetro.WebApi:/workspace
    environment:
      - "ConnectionStrings__AgileRetro=${POSTGRES_CONNECTION_STRING}"
      - "Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS_0}"
      - "LiveKit__ApiKey=${LIVEKIT_API_KEY}"
      - "LiveKit__ApiSecret=${LIVEKIT_API_SECRET}"
      - "LiveKit__Url=${LIVEKIT_URL}"
    entrypoint: ["dotnet", "watch", "--urls", "http://0.0.0.0:5101"]
volumes:
  pgdata:
