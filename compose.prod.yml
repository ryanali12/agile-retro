services:
  db:
    image: postgres:17-alpine
    container_name: "agile_retro_db_prod"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agile_retro -d agile_retro"]
      interval: 5s
      timeout: 5s
      retries: 10
  web_app: 
    depends_on:
      - web_api
    container_name: "agile_retro_web_prod"
    image: ghcr.io/ryanali12/agile-retro-web
    restart: unless-stopped
    ports: 
    - "${WEB_APP_PORT}:80"
    environment:
      - APP_API_URL=${WEB_APP_API_URL}
      - APP_HUB_URL=${WEB_APP_HUB_URL}
      - APP_LIVEKIT_URL=wss://agille-retro-csli5jes.livekit.cloud
  web_api:
    container_name: "agile_retro_web_api_prod"
    depends_on:
      - db
    image: ghcr.io/ryanali12/agile-retro-web-api
    restart: unless-stopped
    ports: 
    - ${WEB_API_PORT}:8080
    environment:
      - "ConnectionStrings__AgileRetro=${POSTGRES_CONNECTION_STRING}"
      - "Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS_0}"
      - "LiveKit__ApiKey=${LIVEKIT_API_KEY}"
      - "LiveKit__ApiSecret=${LIVEKIT_API_SECRET}"
      - "LiveKit__Url=${LIVEKIT_URL}"
  nginx:
    container_name: "agile_retro_proxy"
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
volumes:
  pgdata