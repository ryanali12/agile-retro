<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgileRetro is a collaborative retrospective board. Create a session, share one link, and run a live retro with your team."
    />
    <title>AgileRetro</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong scheme. Keep the key in sync with src/shared/theme/theme.ts.
      ;(function () {
        try {
          var theme = localStorage.getItem('agile-retro.theme')
          if (theme === 'light' || theme === 'dark' || theme === 'system') {
            document.documentElement.dataset.theme = theme
          }
        } catch (error) {
          // Storage may be unavailable; fall back to the system preference.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
